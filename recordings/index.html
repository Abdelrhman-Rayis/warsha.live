<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Recordings | Warsha</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .recordings-wrap { max-width: 1000px; margin: 4rem auto; padding: 0 1.25rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .recordings-header { text-align: center; margin-bottom: 3.5rem; }
    .recordings-header h1 { font-size: 2.2rem; margin: 0 0 0.5rem; color: #1a1f2e; letter-spacing: -0.02em; }
    .recordings-header p { color: #5b6478; margin: 0; font-size: 1.1rem; }
    .back-link { display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; color: #5b6478; text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.2s; }
    .back-link:hover { color: #1a1f2e; }
    .recordings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .recording-card { background: #fff; border: 1px solid #e6e1d4; border-radius: 12px; padding: 1.75rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .recording-card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.06); }
    .recording-card h3 { margin: 0 0 0.5rem; font-size: 1.2rem; color: #1a1f2e; line-height: 1.3; }
    .recording-meta { font-size: 0.85rem; color: #5b6478; margin-bottom: 1.5rem; flex-grow: 1; }
    .status-badge { display: inline-block; padding: 0.25rem 0.6rem; background: #e0f2fe; color: #0284c7; border-radius: 6px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .watch-btn { display: block; text-align: center; width: 100%; padding: 0.85rem; background: #1a1f2e; color: #fff; border: 0; border-radius: 8px; text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: background 0.2s; }
    .watch-btn:hover { background: #2a3142; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: #5b6478; grid-column: 1/-1; background: #faf8f3; border-radius: 12px; border: 1px dashed #d6d0c2; }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; color: #d6d0c2; }
  </style>
</head>
<body style="background: #f8f9fa;">

  <div class="recordings-wrap">
    <a href="/classes" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      Back to Live Classes
    </a>
    
    <header class="recordings-header">
      <h1>Past Class Recordings</h1>
      <p>Watch previous live sessions and workshops.</p>
    </header>

    <div class="recordings-grid" id="recordingsGrid">
      <div style="grid-column: 1/-1; text-align: center; color: #5b6478; padding: 2rem;">Loading recordings...</div>
    </div>
  </div>

  <script>
    async function loadRecordings() {
      const grid = document.getElementById('recordingsGrid');
      try {
        const resp = await fetch('/api/recordings');
        if (!resp.ok) throw new Error('Failed to fetch recordings');
        const data = await resp.json();
        
        if (data.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
              <h3>No recordings available yet</h3>
              <p style="margin-top: 0.5rem;">After a class ends, recordings take a while to process before appearing here.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = data.map(rec => `
          <div class="recording-card">
            <h3>${rec.name || 'Untitled Class'}</h3>
            <p class="recording-meta">
              Status: <span class="status-badge">${rec.state}</span>
            </p>
            <a href="${rec.url}" target="_blank" rel="noopener" class="watch-btn">
              Watch Recording
            </a>
          </div>
        `).join('');

      } catch (err) {
        grid.innerHTML = '<div class="empty-state"><p style="color: #991b1b;">Failed to load recordings.</p></div>';
      }
    }
    
    loadRecordings();
  </script>
</body>
</html>
